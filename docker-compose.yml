# Phase 0/2 scope: PostgreSQL as simulated OLTP source only (ADR 0001).
# The warehouse is DuckDB (no service). Later phases extend this file
# (products-api mock now, Airflow/dashboard later) - kept minimal by design.
#
# Host networking is deliberate: this stack runs in WSL2 with mirrored
# networking (.wslconfig), where Docker's published-port proxy does not
# reliably bridge Windows->container, while host-bound ports do.

services:
  source-postgres:
    image: postgres:17
    container_name: dataforge-source-oltp
    restart: unless-stopped
    network_mode: host
    command: ["postgres", "-p", "5433"]
    environment:
      POSTGRES_DB: sourcedb
      POSTGRES_USER: ${SOURCE_PG_ADMIN_USER:-source_admin}
      POSTGRES_PASSWORD: ${SOURCE_PG_ADMIN_PASSWORD:-change_me_admin}
    volumes:
      - source_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5433 -U ${SOURCE_PG_ADMIN_USER:-source_admin} -d sourcedb"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  source_pgdata:
