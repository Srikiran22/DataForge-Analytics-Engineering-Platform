[tool.pytest.ini_options]
testpaths = ["tests", "airflow/tests"]
markers = [
    "requires_postgres: tests that need the docker-compose Postgres source running",
]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = [
    "TRY004",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001", "E501"]
"dashboards/*" = ["E501"]
# sys.path bootstrap before project imports is intentional in entrypoint scripts
"scripts/*" = ["E402", "E501"]
"tests/integration/conftest.py" = ["E402"]
"tests/integration/test_rdbms_shape.py" = ["E402"]
