name: ci-fast
on:
  pull_request:
  push:
    branches: ["main"]
jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements/dev.txt -r dashboards/requirements.txt dbt-duckdb
      - run: ruff check ingestion dashboards scripts tests
      - run: python -m pytest tests/unit -v
      - run: |
          export WAREHOUSE_PATH=":memory:"
          dbt parse --profiles-dir dbt --project-dir dbt
      - run: python -m pytest airflow/tests/test_dag_parse.py -v
      - run: python -m pytest tests/dashboard -v
  dbt-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements/dev.txt dbt-duckdb
      - run: |
          export WAREHOUSE_PATH=":memory:"
          dbt parse --profiles-dir dbt --project-dir dbt
          dbt compile --profiles-dir dbt --project-dir dbt